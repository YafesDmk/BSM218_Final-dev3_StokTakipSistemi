<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt OL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"> 
    <style>
        body {
            font-family: 'Poppins', sans-serif; /* Yazı tipini belirler */
            background-color: #b8600e;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        .form-kutusu {
            width: 400px;                    /* kutunun genişliğini belirler */
            padding: 20px;                   /* kutunun iç boşluğunu belirler */
            border: 10px solid #ccc;       /* kutunun kenarlığını belirler */
            border-radius: 20px;             /* kenarları yuvarlatır */
            background-color: #f9f9f9;     /* kutunun arka plan rengini belirler */
            height: 800px;                   /* kutunun yüksekliğini belirler */
        }   
        .form-grubu {
            margin-bottom: 15px;         /* form grupları arasına boşluk ekler */
        }
        label {
            display: block;
            margin-bottom: 5px;
            color : #af4c4c;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            
        }
    </style>
</head>
<body>
    <div class="form-kutusu">
        <p style="color: #af4c4c; font-size: 24px; text-align: center;">Tedarikçi Kayıt Formu</p>
        <form action="Tedarikci_Kayıt.php" method="post">
            <div class="form-grubu">
                <label for="dogum-tarihi">Doğum Tarihiniz:</label>
                <input type="date" id="dogum-tarihi" name="tedarikci_dogumG" min="1900-01-01" max="2005-12-31">
            </div>

            <div class="form-grubu">
                <label for="eposta">E-posta Adresiniz:</label>
                <input type="email" id="eposta" name="tedarikci_mail" placeholder="ornek@email.com" required>
            </div>

            <div class="form-grubu">
                <label for="tc-no">TC Kimlik Numaranız:</label>
                <input type="number" id="tc-no" name="tedarikci_tc" min="10000000000" max="99999999999" required placeholder="TC kimlik numaranızı giriniz">
            </div>
            <div class ="form-grubu">
                <label for="ad">Adınız:</label>
                <input type="text" id="ad" name="tedarikci_ad" required placeholder="Adınızı giriniz">
            </div>
            <div class="form-grubu">
                <label for="soyad">Soyadınız:</label>
                <input type="text" id="soyad" name="tedarikci_soyad" required placeholder="Soyadınızı giriniz">
            </div>
            <div class="form-grubu">
                <label for="sifre">Şifreniz:</label>
                <input type="password" id="sifre" name="tedarikci_sifre" required placeholder="Şifrenizi giriniz">
            </div>

            <div class="form-grubu">
                <label for="telefon">Telefon Numaranız:</label>
                <input type="tel" id="telefon" name="tedarikci_num" placeholder="(555) 555-5555">
            </div>
            <div class="form-grubu">
                <label for="adres">Adresiniz:</label>
                <input type="text" id="adres" name="tedarikci_adres" placeholder="Adresinizi giriniz">
            </div>
            <div class="form-grubu">
                <label for="gönder" style="color: #af4c4c;">Kayıt olmak için tıklayınız</label>
                <input type="submit" id="gönder" name="gönder" value="Kayıt Ol">
            </div>
        </form>
    </div>
</body>
</html>
