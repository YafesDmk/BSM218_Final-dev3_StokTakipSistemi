<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satıcı Girişi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #711a94; /* Satıcı temasının yeşil tonu */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-kutusu {
            width: 400px;
            padding: 20px;
            border: 10px solid #ccc;
            border-radius: 20px;
            background-color: #fff;
        }
        .form-grubu { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #4caf50; } /* Başlık rengiyle uyumlu */
        input { width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="form-kutusu">
        <p style="color: #4caf50; font-size: 24px; text-align: center;">Satıcı Giriş Paneli</p>
        
        <form action="Satıcı_giris_islem.php" method="POST">
            
            <div class="form-grubu">
                <label for="eposta">E-posta Adresiniz:</label>
                <input type="email" id="eposta" name="satıcı_mail" placeholder="ornek@email.com" required>
            </div>

            <div class="form-grubu">
                <label for="sifre">Şifreniz:</label>
                <input type="password" id="sifre" name="satıcı_sifre" required placeholder="Şifrenizi giriniz">
            </div>

            <div class="form-grubu">
                <input type="submit" name="giris_yap" value="Giriş Yap" style="background:#711a94; color:white; border:none; padding:10px; cursor:pointer;">
            </div>
        </form>
    </div>
</body>
</html>
